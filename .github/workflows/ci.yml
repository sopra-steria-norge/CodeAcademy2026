name: idempotweet-actions

on:
  pull_request:
    paths:
      - "1-DevOps/idempotweet/**"
      - ".github/workflows/**"
  workflow_call:

jobs:
  ci:
    runs-on: "${{ vars.RUNNER || 'self-hosted' }}"

    defaults:
      run:
        working-directory: 1-DevOps/idempotweet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Corepack
        working-directory: .
        run: corepack enable

      - name: Get yarn cache dir
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('1-DevOps/idempotweet/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependancies
        run: yarn install --immutable

      - name: Test Coverage
        run: yarn test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: 1-DevOps/idempotweet
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
